<style>
:root{--ink:#111111;--paper:#FAF8F2;--alt:#EFE9DA;--card:#FFFFFF;--gold:#B89A5A;--gd:#6B5322;--mute:#46433B;--line:rgba(17,17,17,.24);--err:#A81E16;

:root[lang="en"]{--serif:"Cormorant Garamond","Noto Serif Bengali",Georgia,serif}
:root[data-theme="dark"]{--ink:#FAF8F2;--paper:#111111;--alt:#1A1916;--card:#1E1D1A;--gd:#D1B478;--mute:#CFCABD;--line:rgba(250,248,242,.28);--err:#FF9A90}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
p{margin:0}a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3;margin:0}
:root[lang="en"] h1,:root[lang="en"] h2,:root[lang="en"] h3{font-weight:600;line-height:1.15}
h2{font-size:clamp(27px,4vw,40px);margin-bottom:10px}
.sub{color:var(--mute);max-width:56ch}
section{padding:clamp(52px,8vw,100px) 0}
.alt{background:var(--alt)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 28px;border-radius:2px;border:1.5px solid var(--gold);background:var(--gold);color:#111;font:700 17px var(--sans);text-decoration:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.o{background:transparent;color:inherit;border-color:currentColor}
.btn.o:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{min-height:42px;padding:0 18px;font-size:15.5px}
.ib{display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 10px;border:1.5px solid var(--line);border-radius:2px;background:transparent;color:var(--ink);font:600 14.5px var(--sans);cursor:pointer}
.ib:hover{border-color:var(--ink)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.ib .sun{display:none}:root[data-theme="dark"] .ib .sun{display:block}:root[data-theme="dark"] .ib .moon{display:none}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.nav img{height:34px;width:auto}
.nr{display:flex;align-items:center;gap:22px}
.nr nav{display:flex;gap:24px;font-size:15.5px}
.nr nav a{text-decoration:none;color:var(--mute)}.nr nav a:hover{color:var(--ink)}
.tools{display:flex;gap:8px}
/* hero + gallery */
.hero{padding:clamp(24px,4vw,56px) 0 clamp(52px,7vw,90px)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,72px);align-items:center}
.main{position:relative;aspect-ratio:4/5;background:var(--alt);overflow:hidden;touch-action:pan-y}
.main>img{width:100%;height:100%;object-fit:cover}
.tag,.cn{position:absolute;top:14px;font-size:14.5px;font-weight:700;padding:3px 12px;border-radius:2px}
.tag{left:14px;background:#111;color:#FAF8F2}
.cn{right:14px;background:#FAF8F2;color:#111}
.ar{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:0;background:rgba(250,248,242,.92);color:#111;cursor:pointer;display:grid;place-items:center}
.ar svg{width:20px;height:20px;stroke:#111;fill:none;stroke-width:2.2}
.ar.p{left:12px}.ar.n{right:12px}
.tb{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:12px 2px 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tb button{flex:none;width:clamp(66px,9vw,92px);aspect-ratio:4/5;padding:0;border:2px solid transparent;background:var(--alt);scroll-snap-align:center;cursor:pointer;opacity:.8;transition:opacity .2s,border-color .2s}
.tb button[aria-pressed="true"]{border-color:var(--gold);opacity:1;outline:1px solid var(--ink);outline-offset:-3px}
.tb img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(33px,5vw,56px);margin-bottom:16px}
:root[lang="en"] .hero h1{font-size:clamp(40px,5.6vw,68px)}
.price{display:flex;align-items:baseline;gap:14px;margin:26px 0 10px}
.price b{font:600 clamp(46px,7vw,68px)/1 var(--disp);color:var(--gd)}
.price span{color:var(--mute)}
.hook{display:inline-block;border:1.5px solid var(--gold);padding:4px 14px;font-weight:600;margin-bottom:26px}
/* details */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,80px);align-items:start;margin-top:36px}
.ft{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ft li{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);background:var(--card);font-weight:600;line-height:1.4}
.ft svg{flex:none;width:32px;height:32px;stroke:var(--gd);fill:none;stroke-width:1.6}
.spec{margin:0;border-top:1px solid var(--line)}
.spec div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.spec dt{color:var(--mute)}.spec dd{margin:0;font-weight:600}
h3.sh{font-size:21px;margin-bottom:14px}
/* delivery */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}
.dc{background:var(--card);padding:30px;border:1px solid var(--line)}
.dc.free{border-color:var(--gold);box-shadow:inset 0 4px 0 var(--gold)}
.dc h3{font-size:20px;margin-bottom:12px}
.big{font:600 44px/1.15 var(--disp);color:var(--gd)}
:root[lang="bn"] .big{font-family:var(--serif);font-size:38px}
.dc ul{list-style:none;padding:0;margin:14px 0 0;color:var(--mute)}
.dc li{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0}
/* faq */
.faq{max-width:780px;margin-top:30px}
details{border-top:1px solid var(--line)}details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:20px 40px 20px 0;font:600 18px/1.5 var(--sans);position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:6px;top:14px;font:400 28px var(--sans);color:var(--gd);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 22px;color:var(--mute)}
/* band + footer */
.band{background:#111;color:#FAF8F2;text-align:center;padding:clamp(48px,7vw,84px) 0}
:root[data-theme="dark"] .band{border-top:1px solid var(--line)}
.band h2{margin-bottom:6px}
.band .cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.band .btn.o:hover{background:#FAF8F2;color:#111;border-color:#FAF8F2}
.band .btn:not(.o):hover{background:#FAF8F2;color:#111;border-color:#FAF8F2}
footer{background:#111;color:#FAF8F2;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.fb{padding:26px 0 0;border-top:1px solid rgba(250,248,242,.2)}
.fb .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
footer img{height:32px;width:auto}
.fb span{font:500 20px var(--disp);letter-spacing:.04em;opacity:.85}
.stick{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,calc((100% - 1160px)/2)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.stick b{font:600 28px/1 var(--disp);color:var(--gd)}.stick small{display:block;font-size:13px;color:var(--mute);line-height:1.3}
.stick>div{min-width:0}.stick .btn{flex:1;max-width:260px;min-width:0;white-space:nowrap}
/* modal */
.mo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:grid;place-items:center;padding:20px}
.mo[hidden]{display:none}
.mbox{width:min(620px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:24px;margin:0}
form{display:flex;flex-direction:column;min-height:0;flex:1}
.mb{overflow-y:auto;overscroll-behavior:contain;padding:22px 20px;flex:1;min-height:0}
.mf{padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.mf .btn{width:100%}
label,.lab{display:block;font-weight:600;font-size:15.5px;margin:0 0 7px}
.f{margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input[type=text],input[type=tel],textarea{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);font:400 17px var(--sans)}
textarea{min-height:92px;resize:vertical}
::placeholder{color:var(--mute);opacity:.75}
input:focus,textarea:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;font-weight:500;position:relative}
.chips input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chips span{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:2px;background:var(--paper)}
.chips.cc span{padding:4px 12px 4px 4px}
.chips.cc img{width:36px;height:44px;object-fit:cover}
.chips input:checked+span{border-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);background:var(--alt);font-weight:700}
.chips input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.qty{display:inline-flex;border:1.5px solid var(--line)}
.qty button{width:50px;height:50px;border:0;background:var(--paper);color:var(--ink);font-size:24px;cursor:pointer}
.qty output{min-width:56px;display:grid;place-items:center;font:600 20px var(--sans)}
.sum{border-top:1px solid var(--line);padding-top:14px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .t{font:700 22px var(--serif);padding-top:10px}
.err{color:var(--err);font-size:14.5px;margin-top:4px}
#done{display:none;border:1.5px solid var(--gold);padding:18px;margin-bottom:20px;background:var(--alt)}
#done.on{display:block}
#done pre{white-space:pre-wrap;font:15px/1.6 var(--sans);margin:10px 0 14px}
#done .cta{display:flex;flex-wrap:wrap;gap:10px}
/* responsive */
@media (max-width:980px){.hero .wrap{gap:28px}.nr nav{display:none}}

 .stick b{font:600 28px/1 var(--disp);color:var(--gd)}.stick small{display:block;font-size:13px;color:var(--mute);line-height:1.3}

 footer{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
body{overflow-x:clip}
h1,h2,h3,p,summary,dd,li,.hook{overflow-wrap:anywhere}

@media (max-width:420px){

@media (max-width:340px){

</style>
